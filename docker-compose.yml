services:
  api:
    build: .
    ports:
      - '${PORT:-3005}:3005'
    environment:
      - NODE_ENV=production
      - PORT=3005
    volumes:
      - ./csv:/app/csv
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped
